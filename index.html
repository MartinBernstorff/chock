<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hour Clock</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .clock-grid {
            display: grid;
            grid-template-columns: repeat(8, 80px);
            grid-template-rows: repeat(8, 80px);
            gap: 8px;
        }

        .square {
            width: 80px;
            height: 80px;
            background-color: #1a1a1a;
            transition: background-color 0.3s ease;
        }

        .square.on {
            background-color: #333333;
        }
    </style>
</head>

<body>
    <div class="clock-grid" id="clock"></div>

    <script>
        function updateClock() {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentQuarterHours = currentHour * 4 + Math.floor(currentMinute / 15);

            console.log(currentHour, currentMinute);
            const clockGrid = document.getElementById('clock');
            clockGrid.innerHTML = '';

            // Create 64 squares for 16 hours starting at 8am
            // Each square represents 15 minutes
            for (let i = 0; i < 64; i++) {
                const startQuarterHour = 6 * 4 + i + 1; // Starting at 8am (8*4 = 32 quarter-hours)
                const square = document.createElement('div');
                square.className = 'square';

                if (currentQuarterHours >= startQuarterHour) {
                    square.classList.add('on');
                }

                clockGrid.appendChild(square);
            }
        }

        // Update immediately
        updateClock();

        // Update every minute
        setInterval(updateClock, 60000);
    </script>
</body>

</html>
